<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title"><title id="title">Nu Labs AI illustrative interface, demo data</title><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#f5f6f0" stroke="none"/><rect x="0" y="0" width="252" height="1000" rx="0" fill="#eef0ea" stroke="none"/><text x="32" y="54" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#162319">nu / labs</text><text x="32" y="86" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#586354">PRODUCT EXPLORATIONS</text><rect x="18" y="143" width="216" height="48" rx="8" fill="#dbe2d3" stroke="none"/><path d="M2 2h20v15H9l-7 6z" transform="translate(33 154)" fill="none" stroke="#536052" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="175" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#233121">Assistant</text><rect x="18" y="201" width="216" height="48" rx="8" fill="#eef0ea" stroke="none"/><path d="M8 3h15 M8 11h15 M8 19h15 M1 3h1 M1 11h1 M1 19h1" transform="translate(33 212)" fill="none" stroke="#536052" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="233" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#233121">Knowledge</text><rect x="18" y="259" width="216" height="48" rx="8" fill="#eef0ea" stroke="none"/><path d="M7 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10 M1 23v-3a6 6 0 0 1 12 0v3 M16 5a4 4 0 0 1 0 8 M17 17a5 5 0 0 1 5 5" transform="translate(33 270)" fill="none" stroke="#536052" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="291" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#233121">Conversations</text><rect x="18" y="317" width="216" height="48" rx="8" fill="#eef0ea" stroke="none"/><path d="M1 1h7v7H1z M13 1h7v7h-7z M1 13h7v7H1z M13 13h7v7h-7z" transform="translate(33 328)" fill="none" stroke="#536052" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="349" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#233121">Workflows</text><rect x="18" y="375" width="216" height="48" rx="8" fill="#eef0ea" stroke="none"/><path d="M2 12l6 6L22 3" transform="translate(33 386)" fill="none" stroke="#536052" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="407" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#233121">Review queue</text><path d="M25 896H228" fill="none" stroke="#dce1db"/><text x="32" y="936" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#56624f">Illustrative UI</text><text x="32" y="962" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#56624f">Demo data only</text><text x="300" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#65705e">AI SOLUTIONS / ASSISTANT</text><text x="300" y="108" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#162319">Useful answers. Clear sources.</text><text x="302" y="147" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#576351">Knowledge retrieval, defined actions and human handoff.</text><rect x="1278" y="65" width="270" height="56" rx="8" fill="#18281e" stroke="none"/><text x="1301" y="101" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#fff">Review sources</text><rect x="300" y="188" width="806" height="764" rx="10" fill="#fff" stroke="#dce1db"/><text x="324" y="231" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#203321">Workspace assistant</text><text x="324" y="262" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#66705f">Demonstration conversation</text><rect x="504" y="312" width="566" height="90" rx="10" fill="#e8ede2" stroke="none"/><text x="529" y="350" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202721">What should happen when a return</text><text x="529" y="378" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202721">arrives without its order number?</text><text x="327" y="455" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#4a6043">ASSISTANT</text><text x="327" y="497" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#193422">Start by locating the original sale.</text><text x="327" y="539" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#202721">Ask for the purchase date and store, then check</text><text x="327" y="571" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#202721">the permitted lookup options in the returns guide.</text><text x="327" y="625" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#202721">If you cannot confirm the order, pass the case</text><text x="327" y="657" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#202721">to the support team before approving a return.</text><rect x="327" y="703" width="338" height="31" rx="15" fill="#edf1e8" stroke="none"/><text x="340" y="724" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#354b30">Source: Demo returns guide</text><rect x="324" y="837" width="758" height="73" rx="9" fill="#f6f7f2" stroke="#ccd4c6"/><text x="346" y="880" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#66765f">Ask a follow-up question</text><path d="M3 12h18 M14 5l7 7-7 7" transform="translate(1028 860)" fill="none" stroke="#536052" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="1132" y="188" width="416" height="764" rx="10" fill="#fff" stroke="#dce1db"/><text x="1156" y="231" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#203321">Knowledge &amp; control</text><text x="1156" y="262" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#66705f">A defined information boundary</text><path d="M8 3h15 M8 11h15 M8 19h15 M1 3h1 M1 11h1 M1 19h1" transform="translate(1158 311)" fill="none" stroke="#536052" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="1195" y="332" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#24412a">Demo returns guide</text><text x="1158" y="369" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#65735c">Section 2 / Order verification</text><path d="M1157 397H1523" fill="none" stroke="#dce1db"/><text x="1158" y="445" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#233d28">Human review</text><text x="1158" y="485" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#202721">Uncertain answers stay visible.</text><text x="1158" y="516" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#202721">Exceptions go to a person.</text><rect x="1158" y="559" width="226" height="31" rx="15" fill="#edf1e8" stroke="none"/><text x="1171" y="580" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#354b30">Handoff available</text><text x="1158" y="744" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#617158">ILLUSTRATIVE RESPONSE</text><text x="1158" y="778" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#202721">Not a live assistant or policy.</text><text x="1158" y="809" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#202721">Every organisation sets its rules.</text></svg>